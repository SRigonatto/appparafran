html{background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.card,.chip,.tab,.speak,.brand{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

/* Layout: one-screen communicator. A rounded blue header with the mascot, a speech-bubble sentence panel,
   colored board tabs and a grid of tactile "sticker" buttons. Color tells word type (people, actions, things,
   feelings, places) so children can find cards before they can read. Rounded display face for labels. */
:root{
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Fredoka","Atkinson Hyperlegible",system-ui,sans-serif;
  --font-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --bg:#EAF4FF; --dot:#D2E4F8; --surface:#FFFFFF; --ink:#1B2A4A; --muted:#5A6B8C; --line:#C9DBF2;
  --accent:#2F6BFF; --accent-ink:#FFFFFF; --go:#16874A; --go-ink:#FFFFFF;
  --warn:#FFD84D; --warn-ink:#1B2A4A; --danger:#C0322B;
  --hd1:#4A93FF; --hd2:#2F63F0;
  --misc-bg:#E9EEF8; --misc-line:#7F93B8;
  --noun-bg:#FFE7CC; --noun-line:#F28C28;
  --verb-bg:#D5F5DC; --verb-line:#2FB757;
  --people-bg:#FFF0B3; --people-line:#E8B10C;
  --desc-bg:#D4E6FF; --desc-line:#4B90FF;
  --place-bg:#EBDDFB; --place-line:#9B6BE0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A2E; --dot:#16263F; --surface:#172640; --ink:#EEF3FF; --muted:#9FB0D0; --line:#2A3D5E;
    --accent:#7DB0FF; --accent-ink:#0B1730; --go:#38C77A; --go-ink:#06210F;
    --warn:#FFD84D; --warn-ink:#1B2A4A; --danger:#FF8F86;
    --hd1:#1F3C80; --hd2:#152A5C;
    --misc-bg:#1F2D47; --misc-line:#7F93B8;
    --noun-bg:#3A2814; --noun-line:#F28C28;
    --verb-bg:#123420; --verb-line:#35C15C;
    --people-bg:#3A3010; --people-line:#F5BE1A;
    --desc-bg:#14305A; --desc-line:#4B90FF;
    --place-bg:#2C1F4A; --place-line:#9B6BE0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A2E; --dot:#16263F; --surface:#172640; --ink:#EEF3FF; --muted:#9FB0D0; --line:#2A3D5E;
  --accent:#7DB0FF; --accent-ink:#0B1730; --go:#38C77A; --go-ink:#06210F;
  --warn:#FFD84D; --warn-ink:#1B2A4A; --danger:#FF8F86;
  --hd1:#1F3C80; --hd2:#152A5C;
  --misc-bg:#1F2D47; --misc-line:#7F93B8;
  --noun-bg:#3A2814; --noun-line:#F28C28;
  --verb-bg:#123420; --verb-line:#35C15C;
  --people-bg:#3A3010; --people-line:#F5BE1A;
  --desc-bg:#14305A; --desc-line:#4B90FF;
  --place-bg:#2C1F4A; --place-line:#9B6BE0;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;flex-direction:column;overflow:hidden;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);
  background-size:26px 26px;
  color:var(--ink);
  font-family:var(--font-body);font-size:16px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.e{font-family:var(--font-emoji)}

/* header */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-block:8px 10px;padding:10px 12px;border-radius:26px;
  background:
    radial-gradient(circle at 10% 125%,rgba(255,255,255,.22) 0 30px,transparent 31px),
    radial-gradient(circle at 70% -30%,rgba(255,255,255,.16) 0 46px,transparent 47px),
    linear-gradient(135deg,var(--hd1),var(--hd2));
  box-shadow:0 4px 0 rgba(15,35,100,.28);
}
.brandbox{display:flex;align-items:center;gap:10px;min-width:0}
.mascot{width:48px;height:48px;flex:none}
.brand{font-family:var(--font-display);font-weight:600;font-size:1.7rem;line-height:1;margin:0;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.tag{margin:4px 0 0;font-size:.8rem;color:rgba(255,255,255,.92);white-space:nowrap}
.tools{display:flex;gap:8px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:46px;height:46px;padding:0 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.topbar .iconbtn{border:0;background:#fff;color:#1B2A4A;box-shadow:0 3px 0 rgba(15,35,100,.32)}
.topbar .iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(15,35,100,.32)}
.topbar .iconbtn[aria-pressed="true"]{background:var(--warn);color:var(--warn-ink)}

/* sentence panel */
.say{display:flex;gap:10px;align-items:stretch}
.strip{flex:1;min-width:0;display:flex;gap:8px;align-items:center;overflow-x:auto;background:var(--surface);border:3px solid var(--accent);border-radius:24px;padding:8px 10px;min-height:106px;margin-bottom:4px;box-shadow:0 4px 0 var(--accent)}
.hint{color:var(--muted);padding:0 6px;font-size:1rem}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:68px;min-height:76px;padding:4px 3px;border-radius:16px;background:var(--cb);border:2px solid var(--cl)}
.chip.new{animation:pop .24s ease-out}
.chip .e{font-size:30px;line-height:1}
.chip img{width:38px;height:38px;object-fit:cover;border-radius:9px}
.chip .t{font-family:var(--font-display);font-weight:600;font-size:.74rem;text-align:center;line-height:1.05;max-width:100%;overflow-wrap:anywhere}
.actions{display:flex;flex-direction:column;gap:8px;width:96px}
.speak{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-radius:22px;background:var(--go);color:var(--go-ink);font-family:var(--font-display);font-weight:600;font-size:1.05rem;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
.speak svg.i{width:30px;height:30px}
.speak:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.speak.on{outline:4px solid var(--warn);outline-offset:2px}
.mini{display:flex;gap:8px}
.mini button{flex:1;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line)}
.mini button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

/* tabs */
.tabs{display:flex;gap:10px;overflow-x:auto;padding:10px 2px 9px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;height:50px;padding:0 16px 0 8px;border-radius:999px;border:3px solid var(--line);background:var(--surface);font-family:var(--font-display);font-weight:600;font-size:1rem;white-space:nowrap;box-shadow:0 3px 0 var(--line)}
.tab .e{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--cb);font-size:19px;line-height:1}
.tab[aria-selected="true"]{background:var(--cb);border-color:var(--cl);box-shadow:0 3px 0 var(--cl)}
.tab[aria-selected="true"] .e{background:var(--surface)}
.tab.new{border-style:dashed;box-shadow:none;color:var(--muted);padding-left:16px}

/* grid */
.stage{flex:1;min-height:0;overflow-y:auto;padding:6px 2px 30px;overscroll-behavior:contain}
.editbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;margin-bottom:14px;background:var(--surface);border:2px dashed var(--accent);border-radius:16px;font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell),1fr));gap:14px 12px}
.s-sm{--cell:78px;--emo:30px;--lab:.76rem}
.s-md{--cell:98px;--emo:42px;--lab:.92rem}
.s-lg{--cell:150px;--emo:66px;--lab:1.2rem}
.k-misc{--cb:var(--misc-bg);--cl:var(--misc-line)}
.k-noun{--cb:var(--noun-bg);--cl:var(--noun-line)}
.k-verb{--cb:var(--verb-bg);--cl:var(--verb-line)}
.k-people{--cb:var(--people-bg);--cl:var(--people-line)}
.k-desc{--cb:var(--desc-bg);--cl:var(--desc-line)}
.k-place{--cb:var(--place-bg);--cl:var(--place-line)}
.card{position:relative;aspect-ratio:1/1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;border-radius:22px;border:3px solid var(--cl);background:var(--cb);color:var(--ink);box-shadow:0 5px 0 var(--cl);transition:transform .08s,box-shadow .08s}
.card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cl)}
.card .e{font-size:var(--emo);line-height:1}
.card img{width:calc(var(--emo)*1.5);height:calc(var(--emo)*1.5);object-fit:cover;border-radius:12px}
.card .t{font-family:var(--font-display);font-weight:600;font-size:var(--lab);text-align:center;line-height:1.1;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.grid.editing .card{outline:2px dashed var(--muted);outline-offset:-7px}
.grid.editing .card::after{content:"\270E";position:absolute;top:5px;right:10px;font-size:.9rem;color:var(--muted)}
.card.add{background:transparent;border:3px dashed var(--muted);box-shadow:none;color:var(--muted)}
.card.add:active{transform:none}
.card.add .plus{width:calc(var(--emo)*.9);height:calc(var(--emo)*.9)}
.empty{grid-column:1/-1;color:var(--muted);padding:16px 4px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(8,16,36,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--surface);color:var(--ink);border-radius:28px 28px 0 0;border-top:6px solid var(--accent);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sh-head h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:1.4rem}
.field{display:grid;gap:6px;margin-block:14px}
.field>label,.field>.lab{font-weight:700}
.field small{color:var(--muted)}
input[type=text],select{width:100%;height:50px;padding:0 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.rng{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem}
.btn{min-height:50px;padding:0 18px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 0 var(--line)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn.danger{color:var(--danger);border-color:var(--danger);box-shadow:0 3px 0 var(--danger)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.seg{display:flex;border:2px solid var(--line);border-radius:16px;overflow:hidden}
.seg button{flex:1;min-height:50px;padding:4px 6px;border:0;border-right:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.92rem}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pv{width:116px;--emo:42px;--lab:.92rem;flex:none}
.pv:active{transform:none;box-shadow:0 5px 0 var(--cl)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;max-height:150px;overflow-y:auto;border:2px solid var(--line);border-radius:14px;padding:6px}
.pk{height:44px;font-size:24px;border:0;background:transparent;border-radius:10px;font-family:var(--font-emoji)}
.pk:active{background:var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:30;max-width:calc(100% - 32px);padding:12px 18px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:700;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@media (max-width:420px){.tag{display:none}}
@media (prefers-reduced-motion:reduce){
  .card,.toast,.speak{transition:none}
  .card:active,.speak:active,.btn:active,.topbar .iconbtn:active,.mini button:active{transform:none}
  .chip.new{animation:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brandbox">

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const KEY = 'mi-voz-v1';
const KINDS = {misc:'Básico (gris)',noun:'Cosas (naranja)',verb:'Acciones (verde)',people:'Personas (amarillo)',desc:'Cómo es o cómo me siento (azul)',place:'Lugares (violeta)'};
const EMOJIS = '🙂 😀 😢 😠 😨 😴 🤒 🤕 😷 😋 😍 😎 🤗 🤫 🙏 👍 👎 👋 ✋ 👉 👀 👂 🧠 ❤️ 🍎 🍌 🍇 🍓 🍉 🍊 🍞 🧀 🥚 🍗 🍖 🍕 🍔 🍟 🍝 🍚 🍲 🍪 🍰 🍦 🍫 🥛 💧 🧃 🥤 ☕ 🍵 🍽️ 🥣 ⚽ 🏀 🎲 🧩 🧸 🚙 🚲 🚌 ✈️ 🎈 🎨 ✏️ 📚 🎵 🎧 🎤 📱 💻 📺 🎮 🏠 🏫 🏥 🛒 🌳 🌿 🌞 ⭐ 🔥 ❄️ 🚽 🛁 🚿 🧼 🛏️ 👕 👟 🐶 🐱 🐴 🐟 🐦'.split(' ');

const ICONS = {
  speak:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12"/></svg>',
  back:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5h10.5a1 1 0 011 1v11a1 1 0 01-1 1H9L3.5 12z"/><path d="M12.5 9.5l5 5m0-5l-5 5"/></svg>',

function ico(name){const s=document.createElement('span');s.style.display='inline-flex';s.innerHTML=ICONS[name];return s}

function h(tag, attrs){
  const n = document.createElement(tag);
  attrs = attrs || {};
  for(const k in attrs){
    const v = attrs[k];
    if(v == null || v === false) continue;
    if(k === 'class') n.className = v;
    else if(k === 'text') n.textContent = v;
    else if(k.indexOf('on') === 0) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for(let i = 2; i < arguments.length; i++){
    const c = arguments[i];
    if(c == null || c === false) continue;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return n;
}

/* ---------- data ---------- */
const uid = () => Math.random().toString(36).slice(2, 9);
const C = (label, emoji, say) => ({id:uid(), label, emoji, say:say || ''});
const defaults = () => [
  {id:'basico', name:'Básico', emoji:'⭐', kind:'misc', cards:[
    C('Yo','🙋'), C('Vos','👉'), C('Quiero','🤲'), C('No quiero','🙅'), C('Sí','✅'), C('No','❌'),
    C('Más','➕'), C('Otra vez','🔁'), C('Terminó','🏁'), C('Ayuda','🆘'), C('Esperar','✋'),
    C('Me gusta','👍'), C('No me gusta','👎'), C('Por favor','🙏'), C('Gracias','😊'),
    C('Hola','👋'), C('Chau','🖐️'), C('Abrazo','🤗'), C('Baño','🚽')
  ]},
  {id:'frases', name:'Frases', emoji:'💬', kind:'misc', cards:[
    C('Quiero ir al baño','🚽'), C('Tengo hambre','🍽️'), C('Necesito ayuda','🆘'), C('Quiero jugar','🎲'),
    C('Quiero un abrazo','🤗'), C('Quiero estar solo','🧘'), C('Ya terminé','🏁'), C('¿Cuánto falta?','⏳'),
    C('No entiendo','❓'), C('Quiero ir a casa','🏠')
  ]},
  {id:'comida', name:'Comida', emoji:'🍎', kind:'noun', cards:[
    C('Pan','🍞'), C('Manzana','🍎'), C('Banana','🍌'), C('Galletitas','🍪'), C('Fideos','🍝'), C('Arroz','🍚'),
    C('Pollo','🍗'), C('Carne','🥩'), C('Milanesa','🍖'), C('Huevo','🥚'), C('Queso','🧀'), C('Papas fritas','🍟'),

  ]},
  {id:'siento', name:'Me siento', emoji:'😀', kind:'desc', cards:[
    C('Feliz','😀'), C('Triste','😢'), C('Enojado','😠'), C('Asustado','😨'), C('Cansado','😴'), C('Aburrido','😑'),
    C('Nervioso','😬'), C('Tranquilo','😌'), C('Sorprendido','😮'), C('Enfermo','🤒'), C('Con calor','🥵'),
    C('Con frío','🥶'), C('Te quiero','❤️','te quiero')
  ]},
  {id:'necesidades', name:'Necesito', emoji:'🩺', kind:'desc', cards:[

    C('Tos','😷','tengo tos'), C('Medicina','💊','necesito mi medicina'), C('Mucho ruido','🔊','hay mucho ruido'),

  ]}
];

const state = {boards:null, settings:{size:'md', tap:'both', rate:0.9, pitch:1, voice:''}};
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.boards) && d.boards.length){
        state.boards = d.boards;
        Object.assign(state.settings, d.settings || {});
      }
    }
  }catch(e){}
  if(!state.boards) state.boards = defaults();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({boards:state.boards, settings:state.settings})); }
  catch(e){ toast('No se pudo guardar en este dispositivo. Probá con menos fotos.'); }
}

/* ---------- state ---------- */
load();
let cur = state.boards[0].id;
let editing = false;
let sentence = [];
const board = () => state.boards.find(b => b.id === cur) || state.boards[0];

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ---------- voice ---------- */
let voices = [];
const nativeTTS = () => {
  try{
    const c = window.Capacitor;
    return (c && c.isNativePlatform && c.isNativePlatform() && c.Plugins && c.Plugins.TextToSpeech) || null;
  }catch(e){ return null; }
};
const hasSpeech = !!nativeTTS() || ('speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined');
function speakNative(nt, text){
  const btn = $('btn-speak');
  btn.classList.add('on');
  const langs = ['es-AR','es-US','es-ES'];
  const attempt = i => {
    let p;
    try{
      p = nt.speak({text, lang:langs[i], rate:state.settings.rate, pitch:state.settings.pitch, volume:1.0, category:'ambient'});
    }catch(e){ p = Promise.reject(e); }
    p.then(() => btn.classList.remove('on'))
     .catch(() => {
       if(i + 1 < langs.length) attempt(i + 1);
       else { btn.classList.remove('on'); toast('No se pudo reproducir la voz.'); }
     });
  };
  attempt(0);
}
function loadVoices(){ try{ voices = speechSynthesis.getVoices() || []; }catch(e){ voices = []; } }
if(hasSpeech){
  loadVoices();
  try{ speechSynthesis.addEventListener('voiceschanged', loadVoices); }catch(e){}
}
const esVoices = () => voices.filter(v => /^es/i.test(v.lang));
function pickVoice(){
  const list = esVoices();
  if(state.settings.voice){
    const f = list.find(v => v.voiceURI === state.settings.voice);
    if(f) return f;
  }
  const pref = ['es-ar','es-419','es-us','es-mx','es-uy','es-es'];
  for(const p of pref){
    const m = list.find(v => v.lang.replace('_','-').toLowerCase() === p);
    if(m) return m;
  }
  return list[0] || null;
}
function speak(text){
  if(!text) return;
  if(!hasSpeech){ toast('Este dispositivo no tiene voz disponible.'); return; }
  const nt = nativeTTS();
  if(nt){ speakNative(nt, text); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'es-AR'; }
    u.rate = state.settings.rate;
    u.pitch = state.settings.pitch;
    u.onstart = () => $('btn-speak').classList.add('on');
    u.onend = () => $('btn-speak').classList.remove('on');
    u.onerror = e => {
      $('btn-speak').classList.remove('on');
      if(e && e.error && e.error !== 'interrupted' && e.error !== 'canceled') toast('No se pudo reproducir la voz.');
    };
    speechSynthesis.speak(u);
  }catch(e){ toast('No se pudo reproducir la voz.'); }
}

/* ---------- sentence ---------- */
const strip = $('strip');
function sentenceText(){ return sentence.map(s => s.say || s.label).join(' '); }
function chipNode(s){
  return h('div', {class:'chip k-' + s.kind},
    s.img ? h('img', {src:s.img, alt:''}) : h('span', {class:'e', text:s.emoji || '🙂'}),
    h('span', {class:'t', text:s.label}));
}
function renderSentence(pop){
  strip.replaceChildren();
  if(!sentence.length) strip.appendChild(h('span', {class:'hint', text:'Tocá los símbolos para armar una frase.'}));
  else sentence.forEach((s, i) => {
    const n = chipNode(s);
    if(pop && i === sentence.length - 1) n.classList.add('new');
    strip.appendChild(n);
  });
  strip.scrollLeft = strip.scrollWidth;
  const empty = !sentence.length;
  $('btn-speak').disabled = empty;
  $('btn-back').disabled = empty;
  $('btn-clear').disabled = empty;
}

/* ---------- cards ---------- */
function onCard(b, c){
  if(editing){ openCardEditor(b, c); return; }
  const mode = state.settings.tap;
  if(mode !== 'say'){
    sentence.push({label:c.label, emoji:c.emoji, img:c.img || '', say:c.say || c.label, kind:b.kind});
    renderSentence(true);
  }
  if(mode !== 'add') speak(c.say || c.label);
}
function cardNode(b, c){
  return h('button', {class:'card k-' + b.kind, type:'button', 'aria-label':c.label, onclick:() => onCard(b, c)},
    c.img ? h('img', {src:c.img, alt:''}) : h('span', {class:'e', text:c.emoji || '🙂'}),
    h('span', {class:'t', text:c.label}));
}
function renderGrid(){
  const b = board();
  const g = $('grid');
  g.className = 'grid s-' + state.settings.size + (editing ? ' editing' : '');
  g.replaceChildren(...b.cards.map(c => cardNode(b, c)));
  if(editing){
    g.appendChild(h('button', {class:'card add', type:'button', 'aria-label':'Agregar símbolo', onclick:() => openCardEditor(b, null)},
      ico('plus'), h('span', {class:'t', text:'Agregar'})));
  } else if(!b.cards.length){
    g.appendChild(h('p', {class:'empty', text:'Este tablero está vacío. Tocá Editar para agregar símbolos.'}));
  }
  $('editbar').hidden = !editing;
}
function renderTabs(){
  const t = $('tabs');
  t.replaceChildren(...state.boards.map(b => h('button', {
    class:'tab k-' + b.kind, type:'button', role:'tab', 'aria-selected':b.id === cur ? 'true' : 'false',
    onclick:() => { cur = b.id; renderAll(); $('stage').scrollTop = 0; }
  }, h('span', {class:'e', text:b.emoji}), h('span', {text:b.name}))));
  if(editing){
    t.appendChild(h('button', {class:'tab new', type:'button', onclick:() => openBoardEditor(null)}, '+ Nuevo tablero'));
  }
  const sel = t.querySelector('[aria-selected="true"]');
  if(sel){ try{ sel.scrollIntoView({inline:'center', block:'nearest'}); }catch(e){} }
}
function renderEditBtn(){
  const b = $('btn-edit');
  b.setAttribute('aria-pressed', editing ? 'true' : 'false');
  $('edit-ico').replaceChildren(ico(editing ? 'check' : 'pencil'));
  $('edit-txt').textContent = editing ? 'Listo' : 'Editar';
}
function renderAll(){ renderTabs(); renderGrid(); renderEditBtn(); }

/* ---------- sheet ---------- */
const scrim = $('scrim'), sheet = $('sheet');
function openSheet(title){
  const nodes = Array.prototype.slice.call(arguments, 1);
  sheet.replaceChildren(
    h('div', {class:'sh-head'},
      h('h2', {id:'sh-title', text:title}),
      h('button', {class:'iconbtn', type:'button', 'aria-label':'Cerrar', onclick:closeSheet}, ico('close'))),
    ...nodes);
  scrim.hidden = false;
  sheet.scrollTop = 0;
}
function closeSheet(){ scrim.hidden = true; sheet.replaceChildren(); }
scrim.addEventListener('click', e => { if(e.target === scrim) closeSheet(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !scrim.hidden) closeSheet(); });

function confirmBtn(label, confirmLabel, onconfirm){
  let armed = false, timer;
  const b = h('button', {type:'button', class:'btn danger', text:label, onclick:() => {
    if(!armed){
      armed = true; b.textContent = confirmLabel;
      timer = setTimeout(() => { armed = false; b.textContent = label; }, 4000);
    } else { clearTimeout(timer); onconfirm(); }
  }});
  return b;
}
function seg(opts, current, pick){
  const wrap = h('div', {class:'seg', role:'group'});
  const draw = c => wrap.replaceChildren(...opts.map(o => h('button', {
    type:'button', 'aria-pressed':o[0] === c ? 'true' : 'false', text:o[1],
    onclick:() => { pick(o[0]); draw(o[0]); }
  })));
  draw(current);
  return wrap;
}
function field(labelText, labelFor, control, note){
  return h('div', {class:'field'},
    labelFor ? h('label', {for:labelFor, text:labelText}) : h('span', {class:'lab', text:labelText}),
    control, note ? h('small', {text:note}) : null);
}

function fileToThumb(file, cb){
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const s = 192, c = document.createElement('canvas');
      c.width = s; c.height = s;
      const x = c.getContext('2d');
      const m = Math.min(im.width, im.height);
      x.drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, s, s);
      cb(c.toDataURL('image/jpeg', 0.78));
    };
    im.onerror = () => toast('No se pudo leer esa imagen.');
    im.src = r.result;
  };
  r.onerror = () => toast('No se pudo leer esa imagen.');
  r.readAsDataURL(file);
}

/* ---------- card editor ---------- */
function openCardEditor(b, card){
  const isNew = !card;
  const d = card
    ? {label:card.label, emoji:card.emoji || '', say:card.say || '', img:card.img || ''}
    : {label:'', emoji:'🙂', say:'', img:''};

  const pv = h('div', {class:'card pv k-' + b.kind});
  const drawPv = () => pv.replaceChildren(
    d.img ? h('img', {src:d.img, alt:''}) : h('span', {class:'e', text:d.emoji || '🙂'}),
    h('span', {class:'t', text:d.label || 'Nombre'}));
  drawPv();

  const fLabel = h('input', {id:'f-label', type:'text', maxlength:'40', value:d.label, autocomplete:'off'});
  fLabel.addEventListener('input', () => { d.label = fLabel.value; drawPv(); });
  const fSay = h('input', {id:'f-say', type:'text', maxlength:'120', value:d.say, autocomplete:'off', placeholder:'Solo si se dice distinto'});
  fSay.addEventListener('input', () => { d.say = fSay.value; });
  const fEmoji = h('input', {id:'f-emoji', type:'text', maxlength:'12', value:d.emoji, autocomplete:'off'});
  fEmoji.addEventListener('input', () => { d.emoji = fEmoji.value; drawPv(); });
  const picker = h('div', {class:'picker'}, ...EMOJIS.map(e => h('button', {
    type:'button', class:'pk', text:e, 'aria-label':e,
    onclick:() => { d.emoji = e; d.img = ''; fEmoji.value = e; drawPv(); }
  })));
  const file = h('input', {id:'f-photo', type:'file', accept:'image/*', class:'sr'});
  file.addEventListener('change', () => {
    const f = file.files && file.files[0];
    if(!f) return;
    fileToThumb(f, url => { d.img = url; drawPv(); });
    file.value = '';
  });

  const commit = () => {
    const label = d.label.trim();
    if(!label){ toast('Escribí un nombre para el símbolo.'); fLabel.focus(); return null; }
    return {label, emoji:(d.emoji || '').trim() || '🙂', say:d.say.trim(), img:d.img};
  };
  const move = dir => {
    const data = commit();
    if(!data) return;
    Object.assign(card, data);
    const i = b.cards.indexOf(card), j = i + dir;
    if(j < 0 || j >= b.cards.length) return;
    b.cards.splice(i, 1);
    b.cards.splice(j, 0, card);
    save(); renderAll(); openCardEditor(b, card);
  };

  const idx = card ? b.cards.indexOf(card) : -1;
  const parts = [
    h('div', {class:'row', style:'margin-top:14px;align-items:flex-start'},
      pv,
      h('div', {class:'row', style:'flex:1;min-width:150px;flex-direction:column;align-items:stretch'},
        h('label', {class:'btn', for:'f-photo', text:'Usar una foto'}),
        h('button', {type:'button', class:'btn', text:'Quitar foto', onclick:() => { d.img = ''; drawPv(); }}))),
    file,
    field('Nombre', 'f-label', fLabel),
    field('Dibujo (emoji)', 'f-emoji', fEmoji, 'Elegí uno de la lista, escribilo o usá una foto.'),
    picker,
    field('Qué dice la voz', 'f-say', fSay, 'Si lo dejás vacío, dice el nombre.'),
    h('div', {class:'row', style:'margin-top:16px'},
      h('button', {type:'button', class:'btn primary', text:isNew ? 'Agregar' : 'Guardar', onclick:() => {
        const data = commit();
        if(!data) return;
        if(isNew) b.cards.push(Object.assign({id:uid()}, data)); else Object.assign(card, data);
        save(); renderAll(); closeSheet();
      }}),
      h('button', {type:'button', class:'btn', text:'Probar voz', onclick:() => speak(d.say.trim() || d.label.trim())}))
  ];
  if(!isNew){
    parts.push(h('div', {class:'row', style:'margin-top:12px'},
      h('button', {type:'button', class:'btn', text:'← Mover antes', disabled:idx <= 0, onclick:() => move(-1)}),
      h('button', {type:'button', class:'btn', text:'Mover después →', disabled:idx >= b.cards.length - 1, onclick:() => move(1)})));
    parts.push(h('div', {class:'row', style:'margin-top:12px'},
      confirmBtn('Eliminar símbolo', 'Tocá otra vez para eliminar', () => {
        b.cards.splice(b.cards.indexOf(card), 1); save(); renderAll(); closeSheet();
      })));
  }
  openSheet(isNew ? 'Nuevo símbolo' : 'Editar símbolo', ...parts);
}

/* ---------- board editor ---------- */
function openBoardEditor(b){
  const isNew = !b;
  const d = b ? {name:b.name, emoji:b.emoji, kind:b.kind} : {name:'', emoji:'⭐', kind:'noun'};
  const fName = h('input', {id:'b-name', type:'text', maxlength:'24', value:d.name, autocomplete:'off'});
  fName.addEventListener('input', () => { d.name = fName.value; });
  const fEmoji = h('input', {id:'b-emoji', type:'text', maxlength:'12', value:d.emoji, autocomplete:'off'});
  fEmoji.addEventListener('input', () => { d.emoji = fEmoji.value; });
  const picker = h('div', {class:'picker'}, ...EMOJIS.map(e => h('button', {
    type:'button', class:'pk', text:e, 'aria-label':e, onclick:() => { d.emoji = e; fEmoji.value = e; }
  })));
  const sel = h('select', {id:'b-kind'}, ...Object.keys(KINDS).map(k => h('option', {value:k, text:KINDS[k]})));
  sel.value = d.kind;
  sel.addEventListener('change', () => { d.kind = sel.value; });
  const parts = [
    field('Nombre del tablero', 'b-name', fName),
    field('Dibujo (emoji)', 'b-emoji', fEmoji),
    picker,
    field('Color de los símbolos', 'b-kind', sel, 'Ayuda a encontrar rápido: personas, acciones, cosas.'),
    h('div', {class:'row', style:'margin-top:16px'},
      h('button', {type:'button', class:'btn primary', text:isNew ? 'Crear tablero' : 'Guardar', onclick:() => {
        const name = d.name.trim();
        if(!name){ toast('Escribí un nombre para el tablero.'); fName.focus(); return; }
        const emoji = (d.emoji || '').trim() || '⭐';
        if(isNew){
          const nb = {id:uid(), name, emoji, kind:d.kind, cards:[]};
          state.boards.push(nb); cur = nb.id;
        } else { Object.assign(b, {name, emoji, kind:d.kind}); }
        save(); renderAll(); closeSheet();
      }}))
  ];
  if(!isNew && state.boards.length > 1){
    parts.push(h('div', {class:'row', style:'margin-top:12px'},
      confirmBtn('Eliminar tablero', 'Tocá otra vez para eliminar', () => {
        state.boards = state.boards.filter(x => x.id !== b.id);
        cur = state.boards[0].id;
        save(); renderAll(); closeSheet();
      })));
  }
  openSheet(isNew ? 'Nuevo tablero' : 'Editar tablero', ...parts);
}

/* ---------- settings ---------- */
function openSettings(){
  const s = state.settings;
  const rate = h('input', {id:'s-rate', type:'range', min:'0.5', max:'1.3', step:'0.05', value:String(s.rate)});
  rate.addEventListener('input', () => { s.rate = parseFloat(rate.value); });
  rate.addEventListener('change', save);
  const pitch = h('input', {id:'s-pitch', type:'range', min:'0.6', max:'1.5', step:'0.05', value:String(s.pitch)});
  pitch.addEventListener('input', () => { s.pitch = parseFloat(pitch.value); });
  pitch.addEventListener('change', save);

  const parts = [
    field('Tamaño de los símbolos', null, seg([['sm','Chico'],['md','Mediano'],['lg','Grande']], s.size, v => { s.size = v; save(); renderGrid(); })),
    field('Al tocar un símbolo', null, seg([['both','Decir y agregar'],['add','Solo agregar'],['say','Solo decir']], s.tap, v => { s.tap = v; save(); }),
      'Con "Solo decir" cada símbolo se dice al instante y no arma frase.'),
    field('Velocidad de la voz', 's-rate', rate),
    h('div', {class:'rng'}, h('span', {text:'Lenta'}), h('span', {text:'Rápida'})),
    field('Tono de la voz', 's-pitch', pitch),
    h('div', {class:'rng'}, h('span', {text:'Grave'}), h('span', {text:'Aguda'}))
  ];
  const list = esVoices();
  if(!nativeTTS() && list.length > 1){
    const vs = h('select', {id:'s-voice'},
      h('option', {value:'', text:'Automática'}),
      ...list.map(v => h('option', {value:v.voiceURI, text:v.name + ' (' + v.lang + ')'})));
    vs.value = s.voice || '';
    vs.addEventListener('change', () => { s.voice = vs.value; save(); });
    parts.push(field('Voz', 's-voice', vs));
  }
  parts.push(h('div', {class:'row', style:'margin-top:8px'},
    h('button', {type:'button', class:'btn', text:'Probar voz', onclick:() => speak('Hola, así suena mi voz.')})));
  if(!hasSpeech) parts.push(h('p', {class:'hint', text:'Este dispositivo no ofrece voz. Revisá que tenga un motor de texto a voz instalado.'}));
  parts.push(h('div', {class:'row', style:'margin-top:20px'},
    confirmBtn('Restaurar tableros originales', 'Tocá otra vez: se pierden tus cambios', () => {
      state.boards = defaults(); cur = state.boards[0].id; editing = false; sentence = [];
      save(); renderSentence(); renderAll(); closeSheet(); toast('Tableros restaurados.');
    })));
  openSheet('Ajustes', ...parts);
}

/* ---------- wiring ---------- */
$('btn-settings').appendChild(ico('sliders'));
$('btn-back').appendChild(ico('back'));
$('btn-clear').appendChild(ico('trash'));
$('btn-speak').append(ico('speak'), 'Hablar');
$('btn-settings').addEventListener('click', openSettings);
$('btn-edit').addEventListener('click', () => { editing = !editing; renderAll(); });
$('btn-board').addEventListener('click', () => openBoardEditor(board()));
$('btn-speak').addEventListener('click', () => {
  if(!sentence.length){ toast('Armá una frase tocando símbolos.'); return; }
  speak(sentenceText());
});
$('btn-back').addEventListener('click', () => { sentence.pop(); renderSentence(); });
$('btn-clear').addEventListener('click', () => {
  sentence = []; renderSentence();
  if(hasSpeech){ try{ speechSynthesis.cancel(); }catch(e){} }
});

renderSentence();
renderAll();
})();
</script>
</body>
</html>
